services:

  postgres:
    image: postgres:16
    container_name: jwt-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nikunj@123
      POSTGRES_DB: account_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  node-auth:
    build: ./node-auth
    container_name: node-auth

    ports:
      - "4000:4000"

    environment:
      JWT_SECRET: my-secret-key

    restart: unless-stopped


  account-service:
    build: ./account-service
    container_name: account-service

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Nikunj@123
      JWT_SECRET: my-secret-key

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  transaction-service:
    build: ./transaction-service
    container_name: transaction-service

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Nikunj@123
      JWT_SECRET: my-secret-key

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres_data: