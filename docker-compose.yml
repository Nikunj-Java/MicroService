services:

  postgres:
    image: postgres:16
    container_name: jwt-postgres

    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nikunj@123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  account-service:
    build: ./account-service
    container_name: jwt-springboot

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Nikunj@123

    depends_on:
      - postgres

    restart: unless-stopped
  
  transaction-service:
    build: ./transaction-service
    container_name: transaction

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Nikunj@123

    depends_on:
      - postgres

    restart: unless-stopped
  node-auth:
    build: ./node-auth
    container_name: node-auth

    ports:
      - "4000:4000"

    restart: unless-stopped

volumes:
  postgres_data: