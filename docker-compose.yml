services:

  postgres1:
    image: postgres:16
    container_name: postgres1

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nikunj@123
      POSTGRES_DB: banking_db
      

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      #- ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped
  postgres2:
    image: postgres:16
    container_name: postgres2

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nikunj@123
      POSTGRES_DB: transaction_db
      

    ports:
      - "5433:5433"

    volumes:
      - postgres_data2:/var/lib/postgresql/data
      #- ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  node-auth:
    build: ./node-auth
    container_name: node-auth

    ports:
      - "8083:8083"

    environment:
      JWT_SECRET: mission-control-shared-secret-key-32-bytes-minimum

    restart: unless-stopped


  account-service:
    build: ./account-service
    container_name: account-service

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres1:5432/banking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Nikunj@123
       
    depends_on:
      postgres1:
        condition: service_healthy

    restart: unless-stopped


  transaction-service:
    build: ./transaction-service
    container_name: transaction-service

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres2:5433/transaction_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Nikunj@123
       
    depends_on:
      postgres2:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres_data:
  postgres_data2: