<section class="login-page min-vh-100 d-flex align-items-center justify-content-center bg-light">

  <form
    class="login-card card shadow-sm p-4"
    style="width: 100%; max-width: 420px;"
    (ngSubmit)="submit()"
  >

    <div class="text-center mb-4">
      <h1 class="h3 fw-bold">Login</h1>
      <p class="text-muted mb-0">Sign in to your account</p>
    </div>

    <!-- Username -->
    <div class="mb-3">
      <label for="username" class="form-label">
        Username
      </label>

      <input
        id="username"
        name="username"
        type="text"
        class="form-control"
        [(ngModel)]="username"
        placeholder="Enter username"
        autocomplete="username"
        required
      />
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label for="password" class="form-label">
        Password
      </label>

      <input
        id="password"
        name="password"
        type="password"
        class="form-control"
        [(ngModel)]="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      />
    </div>

    <!-- Error Message -->
    @if (errorMessage) {
      <div class="alert alert-danger py-2" role="alert">
        {{ errorMessage }}
      </div>
    }

    <!-- Login Button -->
    <button
      type="submit"
      class="btn btn-primary w-100"
      [disabled]="isSubmitting"
    >
      {{ isSubmitting ? 'Signing in...' : 'Login' }}
    </button>

  </form>

</section>
