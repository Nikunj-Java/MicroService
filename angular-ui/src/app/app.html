<h1>Welcome to Angular UI</h1>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" routerLink="/">Home</a>
        </li>
         
        <li class="nav-item">
          <a class="nav-link" routerLink="/users">Users</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/summary">Summary</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/directives">Directives</a>
        </li>
         
      </ul>
     @if (tokenStore.isAuthenticated()) {
        <div class="navbar-auth-actions">
          <span class="navbar-text">
            {{ tokenStore.currentUsername() || 'Authenticated user' }}
          </span>
          <span class="navbar-text ms-2">
            Role: {{ currentRoleLabel() }}
          </span>
          <button
            type="button"
            class="btn btn-outline-light btn-sm"
            (click)="logout()"
          >
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</nav>
<router-outlet></router-outlet>
